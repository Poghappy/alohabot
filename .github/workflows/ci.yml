name: CI Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  NODE_VERSION: "20.19.4"
  RUST_VERSION: "stable"
  PNPM_VERSION: "8.15.0"

jobs:
  # =============================================================================
  # Node.js Lint and Test Job
  # =============================================================================
  node-lint-test:
    name: Node.js Lint & Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ["20.19.4"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier check
        run: npm run format:check

      - name: Run TypeScript type check
        run: npm run type-check

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bytebotdb_test
          JWT_SECRET: test-jwt-secret
          ENCRYPTION_KEY: test-encryption-key-32-characters

      - name: Generate coverage report
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella

      - name: Save coverage artifacts
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bytebotdb_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

  # =============================================================================
  # Rust Lint and Test Job
  # =============================================================================
  rust-lint-test:
    name: Rust Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust ${{ env.RUST_VERSION }}
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
          override: true

      - name: Cache Rust dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check Rust formatting
        uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: --all -- --check

      - name: Run Clippy (deny warnings)
        uses: actions-rs/cargo@v1
        with:
          command: clippy
          args: --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        uses: actions-rs/cargo@v1
        with:
          command: test
          args: --all-features --workspace

      - name: Check Rust documentation
        uses: actions-rs/cargo@v1
        with:
          command: doc
          args: --no-deps --document-private-items

  # =============================================================================
  # API Integration Test Job
  # =============================================================================
  api-integration:
    name: API Integration Test
    runs-on: ubuntu-latest
    needs: [node-lint-test]
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Run database migrations
        run: npm run db:migrate:deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bytebotdb_test

      - name: Seed test database
        run: npm run db:seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bytebotdb_test
          NODE_ENV: test

      - name: Start API server
        run: |
          npm run start:test &
          sleep 10
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bytebotdb_test
          JWT_SECRET: test-jwt-secret
          ENCRYPTION_KEY: test-encryption-key-32-characters
          PORT: 3001

      - name: Run API health check
        run: |
          curl -f http://localhost:3001/health || exit 1

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bytebotdb_test
          API_BASE_URL: http://localhost:3001

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bytebotdb_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

  # =============================================================================
  # Security Scan Job
  # =============================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

      - name: Run CodeQL Analysis
        uses: github/codeql-action/init@v2
        with:
          languages: javascript, typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v2

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2

  # =============================================================================
  # Build and Package Job
  # =============================================================================
  build-package:
    name: Build & Package
    runs-on: ubuntu-latest
    needs: [node-lint-test, rust-lint-test]

    strategy:
      matrix:
        target: [web, desktop]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Setup Rust (for desktop build)
        if: matrix.target == 'desktop'
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          override: true

      - name: Install system dependencies (for desktop build)
        if: matrix.target == 'desktop'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Build web application
        if: matrix.target == 'web'
        run: npm run build:web

      - name: Build desktop application
        if: matrix.target == 'desktop'
        run: npm run build:desktop

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-${{ matrix.target }}
          path: |
            dist/
            packages/*/dist/
          retention-days: 7

  # =============================================================================
  # Quality Gate Job
  # =============================================================================
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [node-lint-test, rust-lint-test, api-integration, security-scan]
    if: always()

    steps:
      - name: Check job results
        run: |
          echo "Node.js Lint & Test: ${{ needs.node-lint-test.result }}"
          echo "Rust Lint & Test: ${{ needs.rust-lint-test.result }}"
          echo "API Integration: ${{ needs.api-integration.result }}"
          echo "Security Scan: ${{ needs.security-scan.result }}"

          if [[ "${{ needs.node-lint-test.result }}" != "success" ]]; then
            echo "❌ Node.js tests failed"
            exit 1
          fi

          if [[ "${{ needs.rust-lint-test.result }}" != "success" ]]; then
            echo "❌ Rust tests failed"
            exit 1
          fi

          if [[ "${{ needs.api-integration.result }}" != "success" ]]; then
            echo "❌ API integration tests failed"
            exit 1
          fi

          echo "✅ All quality checks passed"

      - name: Download coverage report
        uses: actions/download-artifact@v3
        with:
          name: coverage-report
          path: coverage/

      - name: Check coverage threshold
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            COVERAGE=$(node -p "JSON.parse(require('fs').readFileSync('coverage/coverage-summary.json', 'utf8')).total.lines.pct")
            echo "Coverage: ${COVERAGE}%"
            if (( $(echo "$COVERAGE < 80" | bc -l) )); then
              echo "❌ Coverage below threshold (80%)"
              exit 1
            fi
            echo "✅ Coverage meets threshold"
          fi

  # =============================================================================
  # Notification Job
  # =============================================================================
  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [quality-gate, build-package]
    if: always()

    steps:
      - name: Notify success
        if: needs.quality-gate.result == 'success' && needs.build-package.result == 'success'
        run: |
          echo "✅ CI Pipeline completed successfully"
          echo "All tests passed and build artifacts created"

      - name: Notify failure
        if: needs.quality-gate.result == 'failure' || needs.build-package.result == 'failure'
        run: |
          echo "❌ CI Pipeline failed"
          echo "Check the logs for details"
          exit 1
