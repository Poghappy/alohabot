name: 🚀 Feature Request
description: 建议新功能或改进
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        感谢您的功能建议！请填写以下信息以帮助我们更好地理解您的需求。

  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 描述您遇到的问题或需求
      placeholder: 我希望能够...，但是目前...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 建议的解决方案
      description: 描述您希望的功能或改进
      placeholder: 我建议添加一个功能，可以...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 描述您考虑过的其他解决方案
      placeholder: 我也考虑过...

  - type: dropdown
    id: category
    attributes:
      label: 功能类别
      description: 选择功能所属的类别
      options:
        - 🎨 用户界面 (UI/UX)
        - 🤖 AI 功能 (AI Features)
        - 🖥️ 桌面应用 (Desktop App)
        - 🔗 集成功能 (Integrations)
        - 📊 数据管理 (Data Management)
        - 🔧 开发工具 (Developer Tools)
        - 🔒 安全功能 (Security)
        - ⚡ 性能优化 (Performance)
        - 📱 移动支持 (Mobile Support)
        - 🌐 Web 功能 (Web Features)
        - 其他 (Other)
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      description: 选择功能的优先级
      options:
        - 🔴 High - 核心功能，急需实现
        - 🟡 Medium - 重要功能，希望尽快实现
        - 🟢 Low - 改进功能，可以稍后实现
    validations:
      required: true

  - type: textarea
    id: use-cases
    attributes:
      label: 使用场景
      description: 描述具体的使用场景和用户故事
      placeholder: |
        作为一个 [用户角色]，
        我希望能够 [功能描述]，
        这样我就可以 [预期收益]。
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: 验收标准
      description: 描述功能完成的标准
      placeholder: |
        - [ ] 用户可以...
        - [ ] 系统应该...
        - [ ] 当...时，应该...

  - type: textarea
    id: mockups
    attributes:
      label: 设计稿或示例
      description: 如果有设计稿、截图或参考示例，请在此提供
      placeholder: 拖拽图片到此处或粘贴链接...

  - type: textarea
    id: technical-considerations
    attributes:
      label: 技术考虑
      description: 如果您有技术背景，请提供技术实现的建议
      placeholder: 可能需要考虑...

  - type: checkboxes
    id: impact
    attributes:
      label: 影响范围
      description: 选择此功能可能影响的范围
      options:
        - label: 前端用户界面
        - label: 后端 API
        - label: 数据库结构
        - label: 第三方集成
        - label: 性能影响
        - label: 安全考虑
        - label: 向后兼容性

  - type: checkboxes
    id: checklist
    attributes:
      label: 检查清单
      description: 请确认以下事项
      options:
        - label: 我已经搜索了现有的 Issues，确认这不是重复建议
          required: true
        - label: 我已经考虑了这个功能的必要性和可行性
          required: true
        - label: 我愿意参与功能的讨论和测试
          required: true
