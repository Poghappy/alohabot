[package]
name = "bytebot-desktop"
version = "0.1.0"
description = "ByteBot Desktop Application"
authors = ["ByteBot Team"]
license = "MIT"
repository = "https://github.com/bytebot-ai/bytebot"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon", "notification", "global-shortcut", "updater", "dialog", "fs", "path", "os", "process", "clipboard"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
anyhow = "1.0"
env_logger = "0.10"
log = "0.4"
dirs = "5.0"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
