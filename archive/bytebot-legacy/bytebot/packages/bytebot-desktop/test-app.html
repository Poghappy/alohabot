<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ByteBot Desktop - 测试页面</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .status {
            background: rgba(255, 255, 255, 0.1);
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
            backdrop-filter: blur(10px);
        }

        .test-section {
            background: rgba(255, 255, 255, 0.1);
            padding: 1.5rem;
            border-radius: 0.75rem;
            margin-bottom: 1rem;
            backdrop-filter: blur(10px);
        }

        .test-button {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
            margin: 0.5rem;
            font-size: 0.875rem;
        }

        .test-button:hover {
            background: linear-gradient(135deg, #2563eb, #1e40af);
        }

        .result {
            background: rgba(0, 0, 0, 0.2);
            padding: 1rem;
            border-radius: 0.5rem;
            margin-top: 1rem;
            font-family: monospace;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>🚀 ByteBot Desktop 测试页面</h1>
            <p>测试 Tauri 桌面应用的基础功能</p>
        </div>

        <div class="status">
            <h3>环境状态</h3>
            <p id="environment-status">检测中...</p>
        </div>

        <div class="test-section">
            <h3>基础功能测试</h3>
            <button class="test-button" onclick="testTauriAPI()">测试 Tauri API</button>
            <button class="test-button" onclick="testTaskCreation()">测试任务创建</button>
            <button class="test-button" onclick="testModelSelection()">测试模型选择</button>
            <div id="test-results" class="result" style="display: none;"></div>
        </div>

        <div class="test-section">
            <h3>UI 组件测试</h3>
            <div id="ui-test-area">
                <p>UI 组件将在这里渲染...</p>
            </div>
        </div>
    </div>

    <script>
        // 检测环境
        function detectEnvironment() {
            const isTauri = window.__TAURI__ !== undefined;
            const status = document.getElementById('environment-status');

            if (isTauri) {
                status.innerHTML = '✅ 运行在 Tauri 桌面环境中';
                status.style.color = '#10b981';
            } else {
                status.innerHTML = '⚠️ 运行在 Web 浏览器环境中 (开发模式)';
                status.style.color = '#f59e0b';
            }
        }

        // 测试 Tauri API
        async function testTauriAPI() {
            const results = document.getElementById('test-results');
            results.style.display = 'block';
            results.textContent = '测试 Tauri API...\n';

            try {
                if (window.__TAURI__) {
                    const tasks = await window.__TAURI__.invoke('get_tasks');
                    results.textContent += `✅ 获取任务列表成功: ${JSON.stringify(tasks, null, 2)}\n`;

                    const models = await window.__TAURI__.invoke('get_available_models');
                    results.textContent += `✅ 获取模型列表成功: ${JSON.stringify(models, null, 2)}\n`;
                } else {
                    results.textContent += '❌ Tauri API 不可用 (在 Web 环境中)\n';
                }
            } catch (error) {
                results.textContent += `❌ 测试失败: ${error.message}\n`;
            }
        }

        // 测试任务创建
        async function testTaskCreation() {
            const results = document.getElementById('test-results');
            results.style.display = 'block';
            results.textContent = '测试任务创建...\n';

            try {
                if (window.__TAURI__) {
                    const newTask = await window.__TAURI__.invoke('create_task', {
                        title: '测试任务',
                        description: '这是一个测试任务'
                    });
                    results.textContent += `✅ 任务创建成功: ${JSON.stringify(newTask, null, 2)}\n`;
                } else {
                    results.textContent += '❌ Tauri API 不可用 (在 Web 环境中)\n';
                }
            } catch (error) {
                results.textContent += `❌ 任务创建失败: ${error.message}\n`;
            }
        }

        // 测试模型选择
        async function testModelSelection() {
            const results = document.getElementById('test-results');
            results.style.display = 'block';
            results.textContent = '测试模型选择...\n';

            try {
                if (window.__TAURI__) {
                    const models = await window.__TAURI__.invoke('get_available_models');
                    if (models.length > 0) {
                        const firstModel = models[0];
                        const result = await window.__TAURI__.invoke('execute_task', {
                            taskId: 'test-task-1',
                            modelId: firstModel.id
                        });
                        results.textContent += `✅ 模型选择测试成功: ${result}\n`;
                    } else {
                        results.textContent += '❌ 没有可用的模型\n';
                    }
                } else {
                    results.textContent += '❌ Tauri API 不可用 (在 Web 环境中)\n';
                }
            } catch (error) {
                results.textContent += `❌ 模型选择测试失败: ${error.message}\n`;
            }
        }

        // 页面加载时检测环境
        document.addEventListener('DOMContentLoaded', detectEnvironment);
    </script>
</body>

</html>
