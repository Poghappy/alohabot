<?xml version="1.0" encoding="UTF-8"?>
<svg width="320" height="120" viewBox="0 0 320 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- V形图标主体 -->
  <g transform="translate(25, 25)" filter="url(#shadow)">
    <!-- 主V形状 -->
    <path d="M0 0 L22 45 L44 0 L36 0 L22 28 L8 0 Z" fill="url(#primaryGradient)"/>
    <!-- 内部高光 -->
    <path d="M8 0 L22 28 L22 25 L12 0 Z" fill="#ffffff" opacity="0.2"/>
    <!-- 底部装饰点 -->
    <circle cx="22" cy="50" r="3" fill="url(#accentGradient)"/>
  </g>
  
  <!-- Vincent文字 -->
  <g transform="translate(90, 40)">
    <text x="0" y="35" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" 
          font-size="36" font-weight="600" fill="#1f2937" letter-spacing="-0.5px">
      Vincent
    </text>
  </g>
  
  <!-- 装饰线条 -->
  <g transform="translate(90, 85)">
    <line x1="0" y1="0" x2="180" y2="0" stroke="url(#accentGradient)" stroke-width="2" opacity="0.8"/>
    <!-- 线条端点装饰 -->
    <circle cx="0" cy="0" r="2" fill="url(#primaryGradient)"/>
    <circle cx="180" cy="0" r="2" fill="url(#primaryGradient)"/>
  </g>
  
  <!-- 品牌标识点 -->
  <g transform="translate(280, 45)">
    <circle cx="0" cy="0" r="4" fill="url(#accentGradient)" opacity="0.6"/>
    <circle cx="0" cy="0" r="2" fill="#ffffff"/>
  </g>
</svg>